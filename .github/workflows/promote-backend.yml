name: Promote backend to production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment to complete
        run: sleep 90

      - name: Get latest deployment and promote to production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_alHPLZc66VtDKZQAV66HPNNM
          PROJECT_ID: prj_WBhhKb1LVuHnIpsH2e7FGPHLgvuS
        run: |
          DEPLOY_UID=$(curl -s \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?teamId=$TEAM_ID&projectId=$PROJECT_ID&limit=1&target=production" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['deployments'][0]['uid'])")
          echo "Latest deployment UID: $DEPLOY_UID"
          curl -s -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"alias":"tarifariosmo.vercel.app"}' \
            "https://api.vercel.com/v2/deployments/$DEPLOY_UID/aliases?teamId=$TEAM_ID"
          echo "Done"
